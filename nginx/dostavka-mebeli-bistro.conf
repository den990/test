server {
    listen 80;
    listen [::]:80;
    server_name dostavka-mebeli-bistro.ru www.dostavka-mebeli-bistro.ru;

    root /var/www/dostavka-mebeli-bistro;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/dostavka-mebeli-bistro.access.log;
    error_log /var/log/nginx/dostavka-mebeli-bistro.error.log;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 256;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|ico|webp|png|jpe?g|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    location ~* \.mp4$ {
        expires 30d;
        try_files $uri =404;
    }

    location ~* \.(md|conf)$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
